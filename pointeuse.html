<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101936">
  <meta name="description" content="Pointeuse tablette sécurisée et hors ligne de PlanniPro.">

  <title>Pointeuse · PlanniPro</title>
  <style>
    :root{--navy:#101936;--navy2:#1d2a59;--ink:#14203b;--muted:#67718b;--bg:#eef2f8;--line:#dce3ef;--card:#fff;--brand:#5667e8;--brand2:#4052d8;--green:#0a9a66;--greenbg:#e7f8ef;--orange:#a76200;--orangebg:#fff4df;--red:#c13443;--redbg:#fff0f2;--r:20px;--shadow:0 20px 60px rgba(12,23,57,.16)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0,#cad2ff 0,transparent 28%),var(--bg);color:var(--ink)}button,input,select{font:inherit}button{touch-action:manipulation}.tc-shell{min-height:100dvh;display:flex;flex-direction:column}.tc-top{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:18px clamp(18px,4vw,46px);color:#fff;background:linear-gradient(115deg,var(--navy),var(--navy2));box-shadow:0 5px 20px rgba(10,19,48,.18)}.tc-brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:850;letter-spacing:-.03em}.tc-brand-mark{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:#fff;color:var(--brand);font-size:15px}.tc-brand b{color:#aeb9ff}.tc-device{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;color:#e6eaff}.tc-status{display:inline-flex;align-items:center;gap:6px}.tc-status:before{content:"";width:8px;height:8px;border-radius:50%;background:#9fa9c6}.tc-status.online:before{background:#46d594}.tc-status.pending:before{background:#ffc252}.tc-status.error:before{background:#ff8d98}.tc-icon-btn{display:grid;place-items:center;width:38px;height:38px;border:1px solid rgba(255,255,255,.24);border-radius:12px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}.tc-main{width:min(1080px,100%);margin:0 auto;padding:clamp(18px,4vw,42px);flex:1}.tc-card{background:var(--card);border:1px solid rgba(205,215,232,.86);border-radius:var(--r);box-shadow:var(--shadow)}.tc-hero{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:22px 24px;margin-bottom:18px}.tc-overline{margin:0 0 6px;text-transform:uppercase;letter-spacing:.11em;font-size:10px;font-weight:850;color:#7180a5}.tc-hero h1{margin:0;font-size:clamp(22px,4vw,34px);letter-spacing:-.045em}.tc-hero p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.5}.tc-clock{flex:0 0 auto;text-align:right}.tc-clock-time{font-size:clamp(27px,4vw,40px);font-weight:850;letter-spacing:-.06em;line-height:1}.tc-clock-date{margin-top:6px;color:var(--muted);font-size:12px;font-weight:650}.tc-search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fafbfe;color:var(--ink);outline:none}.tc-search:focus,.tc-field:focus{border-color:#8897ff;box-shadow:0 0 0 3px rgba(86,103,232,.14)}.tc-section{padding:22px}.tc-section h2{margin:0;font-size:16px;letter-spacing:-.025em}.tc-section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.tc-sub{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.tc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px;margin-top:15px}.tc-employee{min-height:112px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);text-align:left;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}.tc-employee:hover,.tc-employee:focus-visible{transform:translateY(-2px);border-color:#8796ff;box-shadow:0 10px 20px rgba(55,74,161,.14);outline:none}.tc-avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e8ebff;color:#4052d8;font-size:12px;font-weight:850}.tc-employee-name{display:block;margin-top:11px;font-size:13px;font-weight:800;line-height:1.25}.tc-employee-state{display:block;margin-top:4px;color:var(--muted);font-size:10.5px;font-weight:650}.tc-empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}.tc-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px 0;color:var(--muted);font-size:11px}.tc-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:99px;background:#f2f4f9;color:#58627c;font-size:10px;font-weight:800}.tc-badge.pending{background:var(--orangebg);color:var(--orange)}.tc-badge.ok{background:var(--greenbg);color:var(--green)}.tc-dialog-backdrop{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:rgba(8,15,36,.62);backdrop-filter:blur(5px)}.tc-dialog{width:min(510px,100%);max-height:calc(100dvh - 36px);overflow:auto;padding:25px;border-radius:24px;background:#fff;box-shadow:0 26px 75px rgba(3,9,28,.34)}.tc-dialog h2{margin:0;font-size:23px;letter-spacing:-.045em}.tc-dialog p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.52}.tc-dialog-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:9px;margin-top:20px}.tc-btn{border:0;border-radius:12px;padding:11px 14px;background:#f0f2f8;color:#34405f;font-size:13px;font-weight:800;cursor:pointer}.tc-btn.primary{background:var(--brand);color:#fff}.tc-btn.primary:hover{background:var(--brand2)}.tc-btn.danger{background:var(--redbg);color:var(--red)}.tc-btn:disabled{opacity:.55;cursor:not-allowed}.tc-form{display:grid;gap:12px;margin-top:18px}.tc-label{display:grid;gap:6px;color:#43506e;font-size:11px;font-weight:800}.tc-field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);outline:none}.tc-note{margin-top:14px;padding:11px 12px;border-radius:12px;background:#f3f5ff;color:#4553a1;font-size:11.5px;line-height:1.48}.tc-note.error{background:var(--redbg);color:#a12f3b}.tc-note.success{background:var(--greenbg);color:#087a51}.tc-pin-person{display:flex;align-items:center;gap:11px;margin-top:17px;padding:11px;border-radius:14px;background:#f5f6fb}.tc-pin-dots{display:flex;justify-content:center;gap:11px;margin:24px 0 20px}.tc-pin-dot{width:13px;height:13px;border-radius:50%;border:2px solid #aab4cb}.tc-pin-dot.filled{border-color:var(--brand);background:var(--brand)}.tc-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tc-key{min-height:54px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);font-size:21px;font-weight:750;cursor:pointer}.tc-key:hover{background:#f4f6ff;border-color:#9ba8ff}.tc-key.subtle{font-size:12px;color:#5f6b87}.tc-actions-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:20px}.tc-action{min-height:88px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);text-align:left;cursor:pointer}.tc-action strong{display:block;font-size:15px}.tc-action span{display:block;margin-top:5px;color:var(--muted);font-size:11px}.tc-action.in{background:#edf9f2;border-color:#b5eccf;color:#087a51}.tc-action.out{background:#fff3f3;border-color:#ffd0d7;color:#ad3440}.tc-action.pause{background:#fff8e9;border-color:#f8ddb0;color:#955d03}.tc-manager-list{display:grid;gap:9px;margin-top:15px}.tc-manager-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px}.tc-manager-row strong{font-size:13px}.tc-manager-row span{display:block;margin-top:3px;color:var(--muted);font-size:11px}.tc-row-actions{display:flex;gap:7px;flex-shrink:0}.tc-small{padding:8px 10px;font-size:11px}.tc-message{margin:12px 0 0;padding:10px 12px;border-radius:11px;background:#f3f5ff;color:#44549d;font-size:12px;line-height:1.45}.tc-message.error{background:var(--redbg);color:#a82e3b}.tc-message.ok{background:var(--greenbg);color:#087c53}.tc-loader{display:grid;place-items:center;min-height:100dvh;color:#fff;background:var(--navy);font-weight:800}.tc-back{margin-top:8px;background:transparent;color:#5869dd;padding:0}.tc-config-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.tc-setup-steps{display:flex;gap:6px;margin:16px 0}.tc-step{height:6px;flex:1;border-radius:99px;background:#e8ebf3}.tc-step.on{background:var(--brand)}@media(max-width:620px){.tc-top{padding:14px 16px}.tc-device span{display:none}.tc-main{padding:14px}.tc-hero{padding:18px;display:block}.tc-clock{text-align:left;margin-top:17px}.tc-section{padding:18px}.tc-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tc-employee{min-height:103px;padding:12px}.tc-dialog{padding:20px;border-radius:20px}.tc-manager-row{align-items:flex-start;flex-direction:column}.tc-row-actions{width:100%}.tc-row-actions .tc-btn{flex:1}.tc-footer{align-items:flex-start;flex-direction:column}.tc-actions-grid{grid-template-columns:1fr}.tc-key{min-height:50px}}
  </style>
</head>
