    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 0,#ced6ff 0,transparent 30%),var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{touch-action:manipulation}.tc-loader{display:grid;place-items:center;min-height:100dvh;background:var(--navy);color:#fff;font-weight:800}.tc-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:17px clamp(18px,4vw,48px);color:#fff;background:linear-gradient(120deg,var(--navy),var(--navy2));box-shadow:0 6px 24px rgba(8,16,44,.2)}.tc-brand,.tc-device{display:flex;align-items:center;gap:10px}.tc-brand{font-size:19px;font-weight:900;letter-spacing:-.04em}.tc-brand b{color:#b8c1ff}.tc-brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#fff;color:var(--brand);font-weight:950}.tc-device{font-size:12px;font-weight:750;color:#e9ecff}.tc-status{display:inline-flex;align-items:center;gap:7px}.tc-status:before{content:"";width:8px;height:8px;border-radius:50%;background:#ff8190}.tc-status.online:before{background:#45d69a}.tc-icon-btn{display:grid;place-items:center;width:40px;height:40px;border:1px solid rgba(255,255,255,.28);border-radius:12px;background:rgba(255,255,255,.09);color:#fff;cursor:pointer}.tc-main{width:min(1120px,100%);margin:0 auto;padding:clamp(18px,4vw,46px)}.tc-card,.tc-dialog,.tc-pin-panel,.tc-clock-hero,.tc-success{background:var(--card);border:1px solid rgba(207,216,234,.9);border-radius:24px;box-shadow:var(--shadow)}.tc-dialog{width:min(560px,100%);margin:clamp(12px,6vh,62px) auto;padding:clamp(22px,4vw,34px)}h1,h2,h3,p{margin-top:0}.tc-dialog h1,.tc-admin h1{margin-bottom:8px;font-size:clamp(24px,4vw,34px);letter-spacing:-.05em}.tc-dialog p{color:var(--muted);line-height:1.55}.tc-overline{text-transform:uppercase;letter-spacing:.13em;font-size:10px;font-weight:900;color:#7180a5}.tc-form{display: ters>.tc-label{min-width:240px}.tc-inline-form{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.tc-device-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.tc-device-card{display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:18px;border:1px solid var(--line);border-radius:17px;background:#fff}.tc-device-card h3{margin:10px 0 4px;font-size:18px}.tc-device-card p{color:var(--muted);font-size:12px}.tc-device-card dl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 0}.tc-device-card dt{color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:850}.tc-device-card dd{margin:3px 0 0;font-size:11px;font-weight:750}.tc-badge{display:inline-flex;padding:6px 9px;border-radius:99px;background:#f2f4f9;color:#58627c;font-size:10px;font-weight:850}.tc-badge.ok{background:var(--greenbg);color:var(--green)}.tc-badge.pending{background:var(--amberbg);color:var(--amber)}.tc-one-time{display:grid;gap:10px;margin:18px 0;padding:20px;border:2px dashed #8795f4;border-radius:16px;background:#f5f6ff;text-align:center}.tc-one-time strong{font-size:clamp(23px,4vw,36px);letter-spacing:.09em;overflow-wrap:anywhere}.tc-one-time small{color:var(--muted)}.tc-manager-list{display:grid;gap:10px}.tc-manager-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px;border:1px solid var(--line);border-radius:14px}.tc-manager-row span{display:block;margin-top:4px;color:var(--muted);font-size:11px}.tc-empty{padding:42px 18px;text-align:center;color:var(--muted)}
