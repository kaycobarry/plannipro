name: Qualité PlanniPro

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-tests:
    name: Tests statiques et syntaxe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier la syntaxe et les règles métier
        run: npm run test:static

      - name: Vérifier les espaces et marqueurs de conflit
        run: git diff --check
