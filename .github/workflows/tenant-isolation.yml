name: Recette isolation multi-magasin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tenant-isolation-production
  cancel-in-progress: false

jobs:
  end-to-end-isolation:
    name: Deux JWT, RLS, Pointeuse, Storage et Realtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLANNIPRO_TEST_NANTES_EMAIL: ${{ secrets.PLANNIPRO_TEST_NANTES_EMAIL }}
      PLANNIPRO_TEST_NANTES_PASSWORD: ${{ secrets.PLANNIPRO_TEST_NANTES_PASSWORD }}
      PLANNIPRO_TEST_OTHER_EMAIL: ${{ secrets.PLANNIPRO_TEST_OTHER_EMAIL }}
      PLANNIPRO_TEST_OTHER_PASSWORD: ${{ secrets.PLANNIPRO_TEST_OTHER_PASSWORD }}
      PLANNIPRO_TEST_NANTES_ORGANIZATION_ID: ${{ secrets.PLANNIPRO_TEST_NANTES_ORGANIZATION_ID }}
      PLANNIPRO_TEST_OTHER_ORGANIZATION_ID: ${{ secrets.PLANNIPRO_TEST_OTHER_ORGANIZATION_ID }}
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier le correctif local
        run: npm run test:static

      - name: Vérifier les accès anonymes
        run: npm run test:remote:anon

      - name: Vérifier l’isolation réelle entre magasins
        run: npm run test:remote:isolation
